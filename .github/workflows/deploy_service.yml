name: Deploy service
run-name: >-
  Deploy → ${{
    github.event_name == 'workflow_dispatch'
      && format('{0}-{1}', inputs.coin, inputs.network)
      || format('{0}-{1}', github.event.client_payload.coin, github.event.client_payload.network)
  }} ${{ github.event_name == 'workflow_dispatch' && '(manual)' || '(auto)' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      coin:
        description: Coin
        required: true
        type: choice
        options:
          - pepe
      network:
        description: Network
        required: true
        type: choice
        options:
          - testnet
          - mainnet
      sha:
        description: Commit SHA for deploy/rollback (default latest in branch)
        required: false
        default: ''
      confirm_mainnet:
        description: Type DEPLOY_MAINNET to confirm mainnet rollout (required only for mainnet)
        required: false
        default: ''
  repository_dispatch:
    types:
      - deploy

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.coin, inputs.network) || format('{0}-{1}', github.event.client_payload.coin, github.event.client_payload.network) }}
  cancel-in-progress: false

jobs:
  deployment:
    runs-on: self-hosted
    environment: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.coin, inputs.network) || format('{0}-{1}', github.event.client_payload.coin, github.event.client_payload.network) }}

    steps:
      - name: Block mainnet via repository_dispatch
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.network == 'mainnet'
        shell: bash
        run: |
          set -euo pipefail

          echo "Mainnet deploys must be triggered manually via workflow_dispatch."
          exit 1

      - name: Validate explicit mainnet confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.network == 'mainnet'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirm_mainnet }}" != "DEPLOY_MAINNET" ]; then
            echo "Mainnet deploy requires explicit confirmation."
            echo "Re-run workflow_dispatch and set confirm_mainnet=DEPLOY_MAINNET"
            exit 1
          fi

      - name: Checkout repository for local actions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve SERVICE_TAG
        uses: ./.github/actions/resolve-service-tag

      - name: Log SERVICE_TAG
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying image with SHA ${{ env.SERVICE_TAG }}"

      - name: Log in to Docker Registry
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$CI_REGISTRY_PASSWORD" \
            | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      - name: Check if image exists
        uses: ./.github/actions/check-image-exists
        with:
          registry: ${{ secrets.CI_REGISTRY }}
          registry_repo: ${{ secrets.CI_REGISTRY_REPO }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_tag: ${{ env.SERVICE_TAG }}

      - name: Render deploy templates
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_REPO: ${{ secrets.CI_REGISTRY_REPO }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          SERVICE_TAG: ${{ env.SERVICE_TAG }}
          COMPOSE_SERVICE: ${{ vars.COMPOSE_SERVICE }}
          PEPECOIN_P2P_PORT: ${{ vars.PEPECOIN_P2P_PORT }}
          PEPECOIN_RPC_PORT: ${{ vars.PEPECOIN_RPC_PORT }}
          PEPECOIN_COMMAND_ARGS: ${{ vars.PEPECOIN_COMMAND_ARGS }}
          PEPECOIN_MAX_CONNECTIONS: ${{ vars.PEPECOIN_MAX_CONNECTIONS }}
          PEPECOIN_RPC_USER: ${{ vars.PEPECOIN_RPC_USER }}
          PEPECOIN_RPC_PASSWORD: ${{ secrets.PEPECOIN_RPC_PASSWORD }}
          PEPECOIN_RPC_BIND: ${{ vars.PEPECOIN_RPC_BIND }}
          PEPECOIN_RPC_THREADS: ${{ vars.PEPECOIN_RPC_THREADS }}
          PEPECOIN_RPC_ALLOW_IP: ${{ vars.PEPECOIN_RPC_ALLOW_IP }}
          PEPECOIN_EXTRA_CONFIG: ${{ vars.PEPECOIN_EXTRA_CONFIG }}
          PEPECOIN_TEST_EXTRA_CONFIG: ${{ vars.PEPECOIN_TEST_EXTRA_CONFIG }}
        run: |
          set -euo pipefail

          if ! command -v envsubst >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi

          mkdir -p .render
          PEPECOIN_HEALTH_ARGS=$(python3 .github/scripts/node-health-args.py)
          export PEPECOIN_HEALTH_ARGS
          envsubst < deploy/templates/pepecoin.yml.template > .render/pepecoin.yml.updated
          envsubst < deploy/templates/pepecoin.conf.template > .render/pepecoin.conf.updated

      - name: Copy compose file to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOST_1 }}
          username: ${{ secrets.HOST_1_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".render/pepecoin.yml.updated"
          target: "/opt/${{ vars.COIN }}-${{ vars.NETWORK }}/services/${{ vars.SERVICE_NAME }}"
          strip_components: 1

      - name: Copy pepecoin config to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOST_1 }}
          username: ${{ secrets.HOST_1_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".render/pepecoin.conf.updated"
          target: "/opt/${{ vars.COIN }}-${{ vars.NETWORK }}/services/${{ vars.SERVICE_NAME }}/data"
          strip_components: 1

      - name: Deploy service
        uses: ./.github/actions/deploy-over-ssh
        with:
          host: ${{ secrets.HOST_1 }}
          username: ${{ secrets.HOST_1_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          registry: ${{ secrets.CI_REGISTRY }}
          registry_repo: ${{ secrets.CI_REGISTRY_REPO }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_tag: ${{ env.SERVICE_TAG }}
          docker_compose_file: ${{ vars.DOCKER_COMPOSE_FILE }}
          coin: ${{ vars.COIN }}
          network: ${{ vars.NETWORK }}
          compose_service: ${{ vars.COMPOSE_SERVICE }}
          health_timeout_seconds: "600"
          public_health_url: ${{ vars.PUBLIC_HEALTH_URL }}
          reload_nginx: "false"

      - name: Docker logout
        if: always()
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
        run: |
          set +e
          docker logout "$CI_REGISTRY"
          exit 0
