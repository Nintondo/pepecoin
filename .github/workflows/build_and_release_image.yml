name: Build and release Docker image
run-name: >-
  Build & release → ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA for build (default: latest in branch)'
        required: false
        default: ''
      build_jobs:
        description: 'Number of build jobs for Docker build (default: auto)'
        required: false
        default: '0'
      run_tests:
        description: 'Run tests during Docker build (0 or 1)'
        required: false
        default: '0'
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'depends/**'
      - 'entrypoint.sh'
      - 'healthcheck.sh'
      - 'Dockerfile'

concurrency:
  group: build-${{ github.event.inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  semgrep-rust:
    runs-on: self-hosted
    steps:
      - name: Resolve SCAN_REF
        shell: bash
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          GITHUB_SHA_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_SHA" ]; then
            echo "SCAN_REF=$INPUT_SHA" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=$GITHUB_SHA_REF" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository at selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SCAN_REF }}

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y python3-pip pipx
          pipx ensurepath
          pipx install semgrep || pipx upgrade semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report all (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          semgrep --config p/rust .

      - name: Fail on WARNING
        shell: bash
        run: |
          set -euo pipefail

          semgrep --config p/rust --severity WARNING --error .

      - name: Fail on ERROR
        shell: bash
        run: |
          set -euo pipefail

          semgrep --config p/rust --severity ERROR --error .

  build:
    runs-on: self-hosted
    needs: semgrep-rust
    outputs:
      service_tag: ${{ steps.tag.outputs.service_tag }}
    steps:
      - name: Resolve SERVICE_TAG
        id: tag
        shell: bash
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          GITHUB_SHA_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_SHA" ]; then
            echo "SERVICE_TAG=$INPUT_SHA" >> "$GITHUB_ENV"
            echo "service_tag=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "SERVICE_TAG=$GITHUB_SHA_REF" >> "$GITHUB_ENV"
            echo "service_tag=$GITHUB_SHA_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Log SERVICE_TAG
        shell: bash
        run: |
          set -euo pipefail

          echo "Building image with SHA ${{ env.SERVICE_TAG }}"

      - name: Checkout repository at selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SERVICE_TAG }}

      - name: Log in to Docker Registry
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$CI_REGISTRY_PASSWORD" \
            | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      - name: Build and release Docker image
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_REPO: ${{ secrets.CI_REGISTRY_REPO }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          VERSION_PEPE: ${{ vars.VERSION_PEPE }}
          BUILD_JOBS: ${{ github.event.inputs.build_jobs || '0' }}
          RUN_TESTS: ${{ github.event.inputs.run_tests || '0' }}
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail

          IMAGE="${CI_REGISTRY}/${CI_REGISTRY_REPO}/${SERVICE_NAME}"
          verify_image() {
            [ "$(docker image inspect -f '{{if .Config.Healthcheck}}present{{end}}' "${IMAGE}:${SERVICE_TAG}")" = present ]
            [ "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE}:${SERVICE_TAG}")" = "${SERVICE_TAG}" ]
            docker run --rm --entrypoint /app/pepecoind "${IMAGE}:${SERVICE_TAG}" --version >/dev/null
            docker run --rm --entrypoint /app/pepecoin-cli "${IMAGE}:${SERVICE_TAG}" --version >/dev/null
          }
          manifest_error="$(mktemp)"
          if docker manifest inspect "${IMAGE}:${SERVICE_TAG}" >/dev/null 2>"${manifest_error}"; then
            rm -f "${manifest_error}"
            echo "Reusing the existing SHA image; commit tags are never overwritten."
            docker pull --quiet "${IMAGE}:${SERVICE_TAG}"
            verify_image
            exit 0
          fi
          if ! grep -qiE "manifest unknown|no such manifest" "${manifest_error}"; then
            cat "${manifest_error}" >&2
            rm -f "${manifest_error}"
            exit 1
          fi
          rm -f "${manifest_error}"
          docker build \
            --no-cache \
            --pull \
            --build-arg "VERSION_PEPE=${VERSION_PEPE}" \
            --build-arg "BUILD_JOBS=${BUILD_JOBS}" \
            --build-arg "RUN_TESTS=${RUN_TESTS}" \
            --label "org.opencontainers.image.revision=${SERVICE_TAG}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f ./Dockerfile \
            -t "${IMAGE}:${SERVICE_TAG}" \
            ./
          verify_image
          docker push "${IMAGE}:${SERVICE_TAG}"

      - name: Docker logout
        if: always()
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
        run: |
          set +e
          docker logout "$CI_REGISTRY"
          exit 0
