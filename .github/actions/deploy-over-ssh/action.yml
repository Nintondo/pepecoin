name: Deploy over SSH
description: Update compose image and restart the service over SSH.
inputs:
  host:
    description: SSH host for deployment.
    required: true
  username:
    description: SSH username.
    required: true
  ssh_private_key:
    description: SSH private key for authentication.
    required: true
  registry:
    description: Container registry host.
    required: true
  registry_repo:
    description: Container registry repository or namespace.
    required: true
  service_name:
    description: Service name and service directory name.
    required: true
  service_tag:
    description: Image tag to deploy.
    required: true
  docker_compose_file:
    description: Docker compose file path on host (relative to SERVICE_PATH).
    required: true
  coin:
    description: Base directory segment.
    required: true
  network:
    description: Network suffix (testnet|mainnet).
    required: true
  compose_service:
    description: Docker Compose service to restart.
    required: false
    default: ""
  image_name:
    description: Optional image name override.
    required: false
    default: ""
  health_timeout_seconds:
    description: Maximum time to wait for a healthy container.
    required: false
    default: "600"
  public_health_url:
    description: Optional public readiness URL checked from the CI runner.
    required: false
    default: ""
  reload_nginx:
    description: Whether to reload nginx after deploy.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Deploy service
      uses: appleboy/ssh-action@v1.0.0
      env:
        CI_REGISTRY: ${{ inputs.registry }}
        CI_REGISTRY_REPO: ${{ inputs.registry_repo }}
        SERVICE_NAME: ${{ inputs.service_name }}
        SERVICE_TAG: ${{ inputs.service_tag }}
        DOCKER_COMPOSE_FILE: ${{ inputs.docker_compose_file }}
        COIN: ${{ inputs.coin }}
        NETWORK: ${{ inputs.network }}
        COMPOSE_SERVICE: ${{ inputs.compose_service }}
        IMAGE_NAME_OVERRIDE: ${{ inputs.image_name }}
        HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
        RELOAD_NGINX: ${{ inputs.reload_nginx }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.ssh_private_key }}
        envs: CI_REGISTRY,CI_REGISTRY_REPO,SERVICE_NAME,SERVICE_TAG,DOCKER_COMPOSE_FILE,COIN,NETWORK,COMPOSE_SERVICE,IMAGE_NAME_OVERRIDE,HEALTH_TIMEOUT_SECONDS,RELOAD_NGINX
        script: |
          set -Eeuo pipefail

          for var in CI_REGISTRY CI_REGISTRY_REPO SERVICE_NAME SERVICE_TAG DOCKER_COMPOSE_FILE COIN NETWORK; do
            if [ -z "${!var}" ]; then
              echo "Error: Environment variable ${var} is not set."
              exit 1
            fi
          done

          BASE_PATH="/opt/${COIN}-${NETWORK}"
          SERVICE_PATH="${BASE_PATH}/services/${SERVICE_NAME}"

          IMAGE_NAME="${IMAGE_NAME_OVERRIDE}"
          if [ -z "${IMAGE_NAME}" ]; then
            IMAGE_NAME="${SERVICE_NAME}"
          fi

          if [ -z "${COMPOSE_SERVICE}" ]; then
            COMPOSE_SERVICE="${SERVICE_NAME}"
          fi

          IMAGE="${CI_REGISTRY}/${CI_REGISTRY_REPO}/${IMAGE_NAME}:${SERVICE_TAG}"

          if [ ! -d "${SERVICE_PATH}" ]; then
            echo "Error: Service path ${SERVICE_PATH} does not exist."
            exit 1
          fi

          CONTAINER="${COMPOSE_SERVICE}"
          TARGET_COMPOSE="${SERVICE_PATH}/${DOCKER_COMPOSE_FILE}"
          TARGET_CONFIG="${SERVICE_PATH}/data/pepecoin.conf"
          test -f "${TARGET_COMPOSE}"
          test -f "${TARGET_CONFIG}"
          test -f "${SERVICE_PATH}/${DOCKER_COMPOSE_FILE}.updated"
          test -f "${TARGET_CONFIG}.updated"

          COMPOSE_BACKUP="$(mktemp "${SERVICE_PATH}/.compose-backup.XXXXXX")"
          CONFIG_BACKUP="$(mktemp "${SERVICE_PATH}/data/.config-backup.XXXXXX")"
          cp -p "${TARGET_COMPOSE}" "${COMPOSE_BACKUP}"
          cp -p "${TARGET_CONFIG}" "${CONFIG_BACKUP}"

          rollback() {
            status=$?
            trap - ERR
            echo "Deploy failed; restoring the previous compose and node config."
            cp -p "${COMPOSE_BACKUP}" "${TARGET_COMPOSE}"
            cp -p "${CONFIG_BACKUP}" "${TARGET_CONFIG}"
            cd "${BASE_PATH}"
            docker compose up -d --no-deps --force-recreate "${CONTAINER}" || true
            rm -f "${COMPOSE_BACKUP}" "${CONFIG_BACKUP}"
            exit "${status}"
          }
          trap rollback ERR

          mv "${TARGET_COMPOSE}.updated" "${TARGET_COMPOSE}"
          mv "${TARGET_CONFIG}.updated" "${TARGET_CONFIG}"
          grep -Fq "image: ${IMAGE}" "${TARGET_COMPOSE}"

          cd "${BASE_PATH}"
          docker compose config --quiet
          docker compose pull "${CONTAINER}"
          docker compose up -d --no-deps --force-recreate "${CONTAINER}"

          deadline=$((SECONDS + HEALTH_TIMEOUT_SECONDS))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            state="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${CONTAINER}")"
            case "${state}" in
              'running healthy') break ;;
              'running unhealthy'|*' missing'|exited*|dead*)
                echo "Container ${CONTAINER} failed readiness: ${state}"
                false ;;
            esac
            sleep 3
          done
          [ "${state}" = 'running healthy' ] || { echo "Healthcheck timed out: ${state}"; false; }

          if [ "${RELOAD_NGINX}" = "true" ]; then
            docker exec nginx nginx -s reload
          fi
          trap - ERR
          rm -f "${COMPOSE_BACKUP}" "${CONFIG_BACKUP}"
    - name: Check public readiness from CI runner
      if: inputs.public_health_url != ''
      shell: bash
      env:
        PUBLIC_HEALTH_URL: ${{ inputs.public_health_url }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --output /dev/null \
          --connect-timeout 5 --max-time 10 \
          --retry 5 --retry-delay 3 --retry-all-errors \
          "$PUBLIC_HEALTH_URL"
